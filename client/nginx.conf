server {
    listen 3000;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # The overworld map data is several MB of JSON: send text compressed
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    
    # Kept by the browser but checked with the server on every load (an unchanged file
    # comes back as a 304, a few hundred bytes, not the ~12 MB of the world again);
    # a deploy changes them, and they're fetched fresh once
    add_header Cache-Control "no-cache";
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location /assets/ {
        # The build's bundles: their names change with what's in them, so keep them for good
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    
    location /socket.io/ {
        proxy_pass http://game-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    location /api/ {
        proxy_pass http://api-character-sprite-generator:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sprites/ {
        proxy_pass http://game-server:3001;
        proxy_set_header Host $host;
    }

    location /spritesheets/ {
        proxy_pass http://legacy-generator/spritesheets/;
    }
}